name: EV Cost Tracker Update

on:

  schedule:
    - cron: '0 * * * *'

  workflow_dispatch:

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Debug repository
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository root:"
          ls -la

          echo ""
          echo "Data directory:"
          ls -la data || true

          echo ""
          echo "Database files:"
          find . -name "*.db"

          echo ""
          echo "Config:"
          cat config.yaml

      - name: Run updater
        env:
          ALPHAESS_EMAIL: ${{ secrets.ALPHAESS_EMAIL }}
          ALPHAESS_PASSWORD: ${{ secrets.ALPHAESS_PASSWORD }}
        run: |
          python scripts/update_all.py

      - name: Commit changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git diff --staged --quiet || git commit -m "Automatic dashboard update"

          git push

      - name: Done
        run: |
          echo "Workflow completed"