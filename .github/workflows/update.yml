name: EV Cost Tracker Update

on:

  schedule:
    - cron: '0 * * * *'

  workflow_dispatch:

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Set secrets
        env:
          ALPHAESS_EMAIL: ${{ secrets.ALPHAESS_EMAIL }}
          ALPHAESS_PASSWORD: ${{ secrets.ALPHAESS_PASSWORD }}
        run: |
          python scripts/update_all.py

      - name: Commit changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git diff --staged --quiet || git commit -m "Automatic dashboard update"

          git push