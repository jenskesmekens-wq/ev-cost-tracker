<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>EV Cost Tracker</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>EV Cost Tracker</h1>

<div id="summary" class="cards"></div>

<div class="main-grid">

    <div>
        <h2>Laatste laadsessie</h2>
        <div id="latest"></div>
    </div>

    <div>
        <h2>Energieverdeling</h2>
        <div id="energy"></div>
    </div>

</div>

<h2>Historiek</h2>

<table id="history">

<thead>

<tr>
<th>Datum</th>
<th>kWh</th>
<th>Marktkost</th>
<th>Werkelijke kost</th>
<th>Besparing</th>
</tr>

</thead>

<tbody></tbody>

</table>

<script src="app.js"></script>

</body>

</html>
